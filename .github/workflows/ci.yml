name: Check and package
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/*.test.js
      - run: node scripts/check.mjs
      - run: node scripts/package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: metafrasi-extension
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check version tag
        run: node --input-type=module -e "import fs from 'node:fs'; if ('v'+JSON.parse(fs.readFileSync('manifest.json')).version !== process.env.GITHUB_REF_NAME) process.exit(1)"
      - uses: actions/download-artifact@v4
        with:
          name: metafrasi-extension
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "MetaFrasi $GITHUB_REF_NAME" --notes-file CHANGELOG.md --prerelease
